name: 构建并发布 Docker 镜像

# 推送到 master 更新 latest；打 v* 标签（如 v0.1.0）额外发布对应版本号的镜像。
# 镜像发布到 GHCR：ghcr.io/marchen-orz/miyouqian
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 QEMU 交叉构建 arm64，让 NAS、树莓派、ARM 云服务器也能直接拉取
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # 镜像名必须全小写
          images: ghcr.io/marchen-orz/miyouqian
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          # Dockerfile 在 docker/ 下，但要从仓库根目录取源码
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 不附带 provenance 证明，否则 GHCR 的标签列表里会多出 unknown/unknown 条目
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
