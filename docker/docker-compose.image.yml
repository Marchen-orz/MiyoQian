# 直接使用预构建镜像，不需要仓库源码：
#   把本文件保存为 docker-compose.yml，然后 docker compose up -d
# 国内如果拉取 ghcr.io 失败，可把下面的 image 改成：
#   ghcr.nju.edu.cn/marchen-orz/miyouqian:latest
# 手动更新：docker compose pull && docker compose up -d
services:
  miyouqian:
    image: ghcr.io/marchen-orz/miyouqian:latest
    container_name: miyouqian
    restart: unless-stopped
    init: true
    # 启动脚本会自动修正状态卷权限并尽可能降权到 myq 用户运行，同时兼容宿主机 docker.sock 权限
    user: "0:0"
    ports:
      - "5890:5890"
    volumes:
      # 配置、登录凭证和日志都在这个卷里，升级镜像、重建容器都不会丢
      - miyouqian_state:/app/state
      # 挂载 docker.sock 以支持在 Web 控制台「版本更新」中一键拉取新镜像并重建容器；
      # 如不需要容器内自动更新，可注释掉此行
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

volumes:
  miyouqian_state:
    # 固定卷名，不随 compose 所在目录名变化
    name: miyouqian_state
