# -*- coding: utf-8 -*-
# 米游签配置文件。复制为 config.yaml 后填写或用 `python main.py login` 扫码写入。

enable: true

accounts:
  []
# 账号凭据（cookie、stoken、云游戏 tokens 等）存储在 data/credentials.yaml 中
# 每个账号可设置 region: cn（国服，默认）或 os（国际服 HoYoLAB，只支持游戏社区签到）

storage:
  data_dir: data
  credentials_file: credentials.yaml
  log_dir: logs
  log_file: miyouqian.log

device:
  id: ""
  fp: ""
  name: ""
  model: ""
  presets:
    - name: "Xiaomi 14"
      model: "23127PN0CC"
    - name: "Xiaomi 13"
      model: "2211133C"
    - name: "Redmi K70"
      model: "2311DRK48C"
    - name: "OnePlus 12"
      model: "PJD110"
    - name: "vivo X100"
      model: "V2309A"

features:
  game_checkin: true
  cloud_game_checkin: false
  bbs_tasks: false

captcha:
  max_retries: 3
  channels:
    - provider: damagou
      enable: false
      userkey: ""   # 打码狗 userkey
      timeout: 60
    - provider: custom   # 自定义接口，请求/响应需遵循 miyouqian/webui/custom-captcha-api.md
      enable: false
      url: ""        # 完整的接口地址，如 https://gt.example.com/nine，按填写内容原样请求
      api_key: ""    # 选填，填写后通过请求头 X-API-Key 发送
      timeout: 120

schedule:
  enable: false
  time: "09:00"
  jitter_minutes: 45
  run_on_start: false

web:
  host: "127.0.0.1"   # 监听地址，默认仅本机访问；设为 "0.0.0.0" 允许外网访问
  port: 5890          # 监听端口
  password: ""        # Web 控制台访问密码；监听外网时必须认证
                      # 留空表示未设置，首次访问通过页面设置（至少 8 位）；密码哈希会自动保存到此字段

games:
  enabled:
    - genshin
    - starrail
    - zzz
  black_list:
    genshin: []
    starrail: []
    zzz: []

cloud_games:
  enabled:
    - genshin
    - zzz

bbs:
  forums:
    - 5
    - 2
  checkin: true
  read: true
  like: true
  share: true
  cancel_like: true
  post_limit: 5
  delay_seconds:
    - 1
    - 3

push:
  error_only: false
  channels:
    - provider: pushplus
      enable: false
      token: ""
      topic: ""
    # QQ 开放平台官方机器人，和 provider: qq（OneBot）无关
    # user_openid / group_openid 可以手填，也可以在 Web 控制台点「绑定」按钮自动获取并保存
    - provider: qqbot
      enable: false
      app_id: ""
      client_secret: ""
      user_openid: ""
      group_openid: ""
      message_format: text   # text 或 markdown
      api_base: ""           # 留空使用 https://api.bot.qq.com，沙箱填 https://sandbox.api.sgroup.qq.com
    # Gotify（自托管通知服务）
    - provider: gotify
      enable: false
      server: ""          # 服务器地址，形如 https://gotify.example.com，不含 /message 路径
      token: ""           # App Token
      priority: 5         # 优先级 0-10，默认 5

shop_exchange:
  enable: true
  retry_seconds: 20
  retry_interval: 0.4
  push: true          # 是否发送兑换结果推送
  plans: []
